<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            padding-top: 60px;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 32px 40px;
            width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        h1 { font-size: 20px; margin-bottom: 24px; color: #38bdf8; }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            background: #16a34a;
            font-weight: bold;
            font-size: 13px;
        }
        .row { display: flex; justify-content: space-between; margin: 12px 0; font-size: 14px; }
        .label { color: #94a3b8; }
        .value { font-weight: 600; }
        .footer { margin-top: 20px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚙️ DevOps Dashboard</h1>

        <div class="row">
            <span class="label">Status</span>
            <span class="status">{{ status }}</span>
        </div>
        <div class="row">
            <span class="label">Version</span>
            <span class="value">{{ version }}</span>
        </div>
        <div class="row">
            <span class="label">Environment</span>
            <span class="value">{{ environment }}</span>
        </div>
        <div class="row">
            <span class="label">Hostname</span>
            <span class="value">{{ system_info.hostname }}</span>
        </div>
        <div class="row">
            <span class="label">Platform</span>
            <span class="value">{{ system_info.platform }} {{ system_info.platform_version }}</span>
        </div>
        <div class="row">
            <span class="label">Python</span>
            <span class="value">{{ system_info.python_version }}</span>
        </div>

        <div class="footer">Server time: {{ server_time }}</div>
    </div>
</body>
</html>
